name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.9.0). Required for manual dispatch.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build signed release APKs (per-ABI + universal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lint (release)
        run: ./gradlew lintRelease --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Assemble release APKs (split per ABI)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/
          ls -lah artifacts/
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          cat artifacts/SHA256SUMS.txt

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terminal-arrow-release-apks
          path: artifacts/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Terminal Arrow ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
